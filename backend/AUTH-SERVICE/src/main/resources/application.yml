server:
  port: 8099

spring:
  application:
    name: AUTH-SERVICE
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_USUARIOS_URL:jdbc:mysql://localhost:3306/fisiomarca_usuarios?serverTimezone=UTC}
    username: ${DB_USUARIOS_USER:root}
    password: ${DB_USUARIOS_PASSWORD:mysql}
  jpa:
    database: MYSQL
    hibernate:
      ddl-auto: update
    show-sql: true
  messages:
    basename: validaciones

# El mismo secreto (Base64, minimo 32 bytes) y expiracion se comparten entre
# AUTH-SERVICE, el Gateway y todos los microservicios que validan el token.
jwt:
  secret: ${JWT_SECRET:/urSDUIrV3z7QBnshgjDKBw7+MgBEYIki+/z42yAm/E=}
  expiration: ${JWT_EXPIRATION:3600000}

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
