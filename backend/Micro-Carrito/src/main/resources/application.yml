server:
  port: 8093

spring:
  application:
    name: MICRO-CARRITO
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_CARRITO_URL:jdbc:mysql://localhost:3306/fisiomarca_carrito?serverTimezone=UTC}
    username: ${DB_CARRITO_USER:root}
    password: ${DB_CARRITO_PASSWORD:mysql}
  jpa:
    database: MYSQL
    hibernate:
      ddl-auto: update
    show-sql: true
  messages:
    basename: validaciones

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

# Secreto compartido para validar el JWT (HS256) que emite AUTH-SERVICE.
jwt:
  secret: ${JWT_SECRET:/urSDUIrV3z7QBnshgjDKBw7+MgBEYIki+/z42yAm/E=}
  expiration: ${JWT_EXPIRATION:3600000}
